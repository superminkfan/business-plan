</style><text x="24" y="29" class="export-title">VIP №2 · стеллаж у колонны</text><text x="24" y="51" class="text-small">Угловой диван у окна · два пуфа · столик 1,4 × 0,8 м · 16.10.2026</text><g transform="translate(0 70)"><title id="vcc-title">VIP №2: Стеллаж у колонны; коридоры и маршрут через доступную дверь №63 на улицу</title><desc id="vcc-desc">Перегородка коридора сохранена. К колонне со стороны VIP примыкают полки справа и снизу. Хранение открывается внутрь комнаты; шкафов в общем коридоре нет. Контур остальных помещений взят из версии 5. Показаны нижний проход от №65, коридор между VIP, северный проём у 5,64, лестничный узел №63 и выход на улицу. Общая полоса между VIP принята около 1,2 м. Выход из VIP №2 показан отдельно пунктиром. Диван у стены с высоким окном, два пуфа и столик сохранены. Пользователь 16 октября 2026 года подтвердил: дверь №63 существует и доступна для выхода и входа в помещение. Размеры и привязки мебельного эскиза ориентировочные, до обмера.</desc><defs><marker id="vcc-exit-arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L6 3 L0 6 Z" class="vcc-arrow"></path></marker></defs><rect x="22.742372881355934" y="15.776271186440681" width="345.2576271186441" height="96.47796610169492" class="vcc-corridor"></rect><rect x="368" y="15.776271186440681" width="253.0271186440678" height="96.47796610169492" class="vcc-corridor"></rect><rect x="22.742372881355934" y="112.2542372881356" width="90.41016949152542" height="425.3525423728813" class="vcc-corridor"></rect><rect x="113.15254237288136" y="112.2542372881356" width="194.16949152542372" height="238.46440677966103" class="vcc-neighbor"></rect><rect x="313.3898305084746" y="112.2542372881356" width="72.8135593220339" height="238.46440677966103" class="vcc-corridor"></rect><rect x="386.2033898305085" y="112.2542372881356" width="66.74576271186442" height="72.8135593220339" class="vcc-corridor"></rect><rect x="113.15254237288136" y="350.7186440